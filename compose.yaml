services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: safrs
      POSTGRES_PASSWORD: safrs
      POSTGRES_DB: safrs_local
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safrs -d safrs_local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
